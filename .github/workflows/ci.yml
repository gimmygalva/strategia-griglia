name: Grid Hedge Bot quality and native Mac packaging

on:
  push:
    branches: [main, grid-hedge-bot-macos-20260912]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ALLOW_MAINNET_TRADING: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r backend/requirements-dev.txt -r scripts/requirements-packaging.txt
      - run: npm --prefix desktop ci
      - run: python scripts/validate_desktop_config.py
      - run: python -m ruff check backend tests scripts desktop/tests
      - run: python -m compileall -q backend scripts
      - run: python -m pytest tests desktop/tests -q --junitxml=build/reports/backend-tests.xml
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run lint
      - run: npm --prefix frontend test
      - run: npm --prefix frontend run build
      - run: python scripts/run_frontend_backend_e2e.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-test-evidence
          path: build/reports/

  macos-package:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            architecture: intel
          - runner: macos-15
            architecture: apple-silicon
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      ALLOW_MAINNET_TRADING: "false"
      APPLE_SIGNING_IDENTITY: "-"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: bash scripts/build-macos.sh
        env:
          GRIDBOT_BUILD_PYTHON: python
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Grid-Hedge-Bot-${{ matrix.architecture }}-local-candidate
          path: dist/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-${{ matrix.architecture }}-test-evidence
          path: build/reports/
