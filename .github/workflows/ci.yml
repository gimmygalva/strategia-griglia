name: Grid Hedge Bot quality and native Mac packaging

on:
  push:
    branches: [main, grid-hedge-bot-macos-20260912, grid-hedge-bot-monterey-12]
    paths-ignore: ['**/*.md']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      ALLOW_MAINNET_TRADING: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m venv .audit-venv
      - run: .audit-venv/bin/python -m pip install --upgrade pip==26.2.1
      - run: .audit-venv/bin/python -m pip install -r backend/requirements-dev.txt -r scripts/requirements-packaging.txt pip-audit==2.10.1
      - run: mkdir -p build/reports
      - run: .audit-venv/bin/python -m pip_audit --local --strict --format=json --output=build/reports/python-dependency-audit.json
      - run: npm --prefix frontend ci
        if: always()
      - run: npm --prefix frontend audit --json > build/reports/frontend-dependency-audit.json
        if: always()
      - run: npm --prefix desktop ci
        if: always()
      - run: npm --prefix desktop audit --json > build/reports/desktop-dependency-audit.json
        if: always()
      - run: cargo install cargo-audit --version 0.22.2 --locked
        if: always()
        id: install-rust-audit
      - run: cargo audit --file desktop/Cargo.lock --json > build/reports/rust-dependency-audit.json
        if: always() && steps.install-rust-audit.outcome == 'success'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-security-evidence
          path: build/reports/

  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ALLOW_MAINNET_TRADING: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install --upgrade pip==26.2.1
      - run: python -m pip install -r backend/requirements-dev.txt -r scripts/requirements-packaging.txt
      - run: npm --prefix desktop ci
      - run: python scripts/validate_desktop_config.py
      - run: python -m ruff check backend tests scripts desktop/tests
      - run: python -m compileall -q backend scripts
      - run: python -m pytest tests desktop/tests -q --junitxml=build/reports/backend-tests.xml
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run lint
      - run: npm --prefix frontend test
      - run: npm --prefix frontend run build
      - run: python scripts/run_frontend_backend_e2e.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-test-evidence
          path: build/reports/

  macos-package:
    needs: [quality, dependency-security]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            architecture: intel
          - runner: macos-15
            architecture: apple-silicon
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      ALLOW_MAINNET_TRADING: "false"
      APPLE_SIGNING_IDENTITY: "-"
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: bash scripts/build-macos.sh
        env:
          GRIDBOT_BUILD_PYTHON: python
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Grid-Hedge-Bot-${{ matrix.architecture }}-local-candidate
          path: dist/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-${{ matrix.architecture }}-test-evidence
          path: build/reports/
