name: Official Bybit Demo network and account verification

on:
  push:
    branches: [grid-hedge-bot-demo-20260912]
    paths: [".github/workflows/bybit-demo.yml", "ci/**", "backend/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  official-network:
    if: github.ref == 'refs/heads/grid-hedge-bot-demo-20260912'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15-intel, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    env:
      ALLOW_MAINNET_TRADING: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip==26.2.1
      - run: python -m pip install -r backend/requirements.txt
      - run: python ci/bybit_network_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-bybit-network-evidence-${{ matrix.runner }}
          path: build/reports/bybit-network.json
