[package]
name = "grid-hedge-bot"
version = "0.1.0"
description = "Grid Hedge Bot — supervised local backend"
authors = ["Grid Hedge Bot"]
edition = "2021"
rust-version = "1.84"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8.5"
libc = "0.2"

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
strip = true
lto = true
codegen-units = 1
